name: ci
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"   # weekly: catch Postgres behaviour changes in new 17.x images

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: lab
          POSTGRES_PASSWORD: lab
          POSTGRES_DB: lab
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lab -d lab"
          --health-interval 2s --health-timeout 3s --health-retries 30
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 3s --health-retries 30
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: lab
          MYSQL_DATABASE: lab
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -plab"
          --health-interval 2s --health-timeout 3s --health-retries 60
    env:
      DATABASE_URL: postgres://lab:lab@localhost:5432/lab?sslmode=disable
      REDIS_URL: redis://localhost:6379/0
      MYSQL_DSN: root:lab@tcp(localhost:3306)/lab
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Format
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - name: Tests (pin the isolation matrix)
        run: go test -race -count=1 -p 1 ./...   # demos share one database
      - name: Print the matrix
        run: go run ./cmd/isolation >> "$GITHUB_STEP_SUMMARY"

  mongo:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 03-mongodb-schemas
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # Started by hand (not as a service) to pass ttlMonitorSleepSecs, which
      # makes the TTL check take seconds instead of minutes.
      - name: Start MongoDB 8.2
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:8.2 mongod --setParameter ttlMonitorSleepSecs=1
          for _ in $(seq 1 30); do docker exec mongo mongosh --quiet --eval 'db.adminCommand("ping").ok' && exit 0; sleep 2; done
          exit 1
      - run: npm ci
      - name: Tests (pin the MongoDB results)
        run: node --test
        env:
          MONGO_URL: mongodb://localhost:27017

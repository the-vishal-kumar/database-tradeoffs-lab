# The databases the demos run against. Ports bind to localhost only.
name: database-tradeoffs-lab

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab   # local demo only
      POSTGRES_DB: lab
    ports: ["127.0.0.1:55432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab -d lab"]
      interval: 2s
      timeout: 3s
      retries: 30

  # MongoDB 8.2 (8.0 refuses to start on Linux 6.19+ kernels: SERVER-121912).
  # ttlMonitorSleepSecs=1 makes the TTL demo take seconds, not minutes; the
  # production default is 60.
  mongo:
    image: mongo:8.2
    command: ["mongod", "--setParameter", "ttlMonitorSleepSecs=1"]
    ports: ["127.0.0.1:57017:27017"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 2s
      timeout: 5s
      retries: 30

  # Redis for the cache demo: no persistence, so every run starts empty.
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports: ["127.0.0.1:56379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  # MySQL for the long-transaction demo (InnoDB's undo log vs PostgreSQL's VACUUM).
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: lab   # local demo only
      MYSQL_DATABASE: lab
    ports: ["127.0.0.1:53306:3306"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-plab"]
      interval: 2s
      timeout: 3s
      retries: 60

  # Runs the MongoDB demo without Node installed: `make mongo`.
  node:
    image: node:22
    profiles: ["tools"]
    working_dir: /src/03-mongodb-schemas
    volumes: [".:/src"]
    environment:
      MONGO_URL: mongodb://mongo:27017
    depends_on:
      mongo: { condition: service_healthy }

  # Runs the demos without Go installed: `make isolation`.
  go:
    image: golang:1.27.3-bookworm
    profiles: ["tools"]
    working_dir: /src
    volumes: [".:/src", "gocache:/root/.cache/go-build", "gomod:/go/pkg/mod"]
    environment:
      DATABASE_URL: postgres://lab:lab@postgres:5432/lab?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      MYSQL_DSN: root:lab@tcp(mysql:3306)/lab
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

volumes:
  gocache:
  gomod:
